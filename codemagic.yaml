workflows:
  ios-appstore:
    name: ConsistentUs iOS App Store
    max_build_duration: 60
    working_directory: app
    environment:
      flutter: 3.44.3
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.consistentus.mindful
      groups:
        - apple
    scripts:
      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "@env:APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key "@env:CERTIFICATE_PRIVATE_KEY" \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up Xcode code signing
        script: xcode-project use-profiles

      - name: Flutter pub get
        script: flutter pub get

      - name: Update iOS pods
        script: |
          cd ios
          pod update FirebaseCore FirebaseAuth FirebaseMessaging FirebaseCrashlytics
          pod install --repo-update
          cd ..

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.1.3 \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --dart-define=NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --dart-define=RAZORPAY_KEY_ID="$RAZORPAY_KEY_ID"
    artifacts:
      - app/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        apple_id: $APPLE_ID
        password: $APP_SPECIFIC_PASSWORD
